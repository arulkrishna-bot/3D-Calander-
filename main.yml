name: Build Android APK
​on:
push:
branches: ["main", "master"]
workflow_dispatch:
​jobs:
build-apk:
name: Build Native Android APK
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Setup Node.js Environment
uses: actions/setup-node@v4
with:
node-version: '20'
​- name: Setup Java JDK 17
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
​- name: Setup Android SDK
uses: android-actions/setup-android@v3
​# வெறும் index.html மட்டும் இருந்தாலும் தானாகவே Android சூழலை உருவாக்கும் கட்டமைப்பு
- name: Auto-generate Capacitor & Configs
run: |
mkdir -p www
cp index.html www/index.html
cat << 'EOF' > package.json
{
"name": "tamil-3d-calendar",
"version": "1.0.0",
"dependencies": {
"@capacitor/android": "^6.1.2",
"@capacitor/core": "^6.1.2"
},
"devDependencies": {
"@capacitor/cli": "^6.1.2"
}
}
EOF
cat << 'EOF' > capacitor.config.json
{
"appId": "com.arulkrish.tamilcalendar3d",
"appName": "3D Tamil Calendar",
"webDir": "www",
"bundledWebRuntime": false,
"server": {
"androidScheme": "https"
}
}
EOF
npm install
npx cap add android
npx cap sync android
​- name: Build Debug Android APK
working-directory: ./android
run: |
chmod +x gradlew
./gradlew assembleDebug --stacktrace
​- name: Upload Debug APK as Downloadable Artifact
uses: actions/upload-artifact@v4
with:
name: Tamil-Calendar-Debug-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
retention-days: 14
