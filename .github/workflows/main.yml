name: Build Android APK
​on:
push:
branches: [main, master]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with: { node-version: 20 }
- uses: actions/setup-java@v4
with: { distribution: temurin, java-version: 17 }
- run: mkdir -p www && cp index.html www/index.html
- run: npm init -y
- run: npm install @capacitor/core @capacitor/android @capacitor/cli
- run: npx cap init TamilCalendar com.arulkrish.calendar --web-dir www
- run: npx cap add android
- run: npx cap sync android
- run: cd android && chmod +x gradlew && ./gradlew assembleDebug
- uses: actions/upload-artifact@v4
with: { name: Tamil-Calendar-Debug-APK, path: android/app/build/outputs/apk/debug/app-debug.apk }
